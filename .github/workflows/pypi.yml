# Build pyfaup wheels for every supported OS/architecture and publish them to PyPI
# whenever a release tag (v1.6, v1.7, ...) is pushed.
#
# One-time setup (no API token needed, uses PyPI "trusted publishing"):
#   1. https://pypi.org/manage/project/pyfaup/settings/publishing/ -> add a GitHub publisher:
#        owner: stricaud   repository: faup   workflow: pypi.yml   environment: pypi
#   2. GitHub repo -> Settings -> Environments -> create "pypi" (optionally add yourself
#      as required reviewer so a release waits for your approval before uploading).
#
# Wheels are platform wheels but Python-version independent (py3-none-<platform>), since
# pyfaup talks to libfaupl through ctypes. See [tool.cibuildwheel] in pyproject.toml.

name: Publish pyfaup to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual run = build everything, publish nothing

permissions:
  contents: read

jobs:
  check-version:
    name: Tag matches VERSION file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag VERSION=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match VERSION file ($version). Bump VERSION first."
            exit 1
          fi

  build-wheels:
    name: Wheels on ${{ matrix.os }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # Linux x86_64 (manylinux + musllinux)
          - os: ubuntu-24.04-arm     # Linux aarch64 (manylinux + musllinux)
          - os: macos-latest         # macOS arm64 natively + x86_64 cross-built
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    name: Upload to PyPI
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyfaup/
    permissions:
      id-token: write   # trusted publishing (OIDC), no PyPI token to store
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Show what will be uploaded
        run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI never accepts a file twice. If a tag is moved and rebuilt after a
          # successful upload, skip the files already published instead of failing.
          skip-existing: true
